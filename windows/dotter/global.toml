[settings]
default_target_type = "symbolic"

# Map configuration only; Markdown helpers are intentionally omitted.

[git.files]
"git/.gitconfig" = "~/.gitconfig"

[ssh.files]
"ssh/.ssh/config" = "~/.ssh/config"
"ssh/.ssh/config.d/linux.conf" = "~/.ssh/config.d/linux.conf"

[nvim.files]
"nvim/.config/nvim" = "${LOCALAPPDATA}/nvim"

[wezterm.files]
"wezterm/.config/wezterm" = "~/.config/wezterm"

[windows-terminal.files]
"windows/terminal/settings.json" = "${SCOOP}/persist/windows-terminal/settings/settings.json"

[atuin.files]
"atuin/.atuin/config.toml" = "~/.atuin/config.toml"
"atuin/.atuin/themes" = "~/.atuin/themes"

[starship.files]
"starship/.config/starship.toml" = "~/.config/starship.toml"

[bat.files]
"bat/.config/bat/config" = "${APPDATA}/bat/config"

[broot.files]
"broot/.config/broot/conf.hjson" = "${APPDATA}/dystroy/broot/config/conf.hjson"
"broot/.config/broot/skins/iceberg-dark.hjson" = "${APPDATA}/dystroy/broot/config/skins/iceberg-dark.hjson"

[lazygit.files]
"lazygit/.config/lazygit/config.yml" = "${LOCALAPPDATA}/lazygit/config.yml"

[zed.files]
"zed/.config/zed" = "${APPDATA}/Zed"

[codex.files]
"codex/.codex/AGENTS.md" = "~/.codex/AGENTS.md"

[llvm.files]
"llvm/.clang-format" = "~/.clang-format"
"llvm/.clang-tidy" = "~/.clang-tidy"
"llvm/.lldbinit" = "~/.lldbinit"
"llvm/.config/clangd/config.yaml" = "${LOCALAPPDATA}/clangd/config.yaml"

[zellij.files]
"zellij/.config/zellij/config.kdl" = "${APPDATA}/Zellij/config/config.kdl"
"zellij/.config/zellij/layouts" = "${APPDATA}/Zellij/config/layouts"

[powershell.files]
"powershell/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
"powershell/.config/powershell" = "~/.config/powershell"
