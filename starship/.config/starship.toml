"$schema" = "https://starship.rs/config-schema.json"

scan_timeout = 100
command_timeout = 500
follow_symlinks = false
add_newline = false
palette = "iceberg_dark"

format = """\
$username\
$hostname\
$sudo\
$directory\
${custom.giturl_unix}\
${custom.giturl_windows}\
$git_branch\
$git_commit\
${custom.git_worktree_unix}\
${custom.git_worktree_windows}\
$git_status\
$git_metrics\
$character\
"""
right_format = "$all"

[username]
disabled = true
show_always = true
style_user = "bold fg:green"
style_root = "bold fg:red"
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = true
ssh_symbol = "󰣀 SSH"
style = "bold dimmed fg:green"
format = "[@$hostname]($style)( [$ssh_symbol](bold fg:crust bg:green))"

[sudo]
disabled = false
symbol = "sudo"
style = "bold fg:red"
format = "[ $symbol]($style)"

[directory]
style = "bold fg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "
"Others" = " "

[character]
disabled = false
# Bash mirrors these values in blerc.bash because Starship cannot observe
# ble.sh's active vi mode. Other supported shells use these values directly.
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:#9baed8)"

[custom.giturl_unix]
description = "Display symbol for remote Git server"
shell = ["bash"]
os = "unix"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
  GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
  GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
  GIT_REMOTE_SYMBOL=" "
else
  GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "$output"
require_repo = true
ignore_timeout = true

[custom.giturl_windows]
description = "Display symbol for remote Git server"
shell = ["pwsh", "-NoProfile", "-Command", "-"]
os = "windows"
command = """
$git_remote = git ls-remote --get-url 2>$null
if ($LASTEXITCODE -ne 0) {
  exit $LASTEXITCODE
}
$git_remote_symbol = switch -Regex ($git_remote) {
  "github" { " "; break }
  "gitlab" { " "; break }
  "bitbucket" { " "; break }
  default { " " }
}
Write-Output "$git_remote_symbol "
"""
when = """
git rev-parse --is-inside-work-tree 2>$null | Out-Null
exit $LASTEXITCODE
"""
format = "$output"
require_repo = true
ignore_timeout = true

[git_branch]
symbol = " "
style = "bold fg:green"
format = "  [$symbol$branch]($style) "

[git_commit]
only_detached = false
tag_disabled = false
tag_symbol = ""
style = "bold fg:teal"
format = "([\\[$tag\\]]($style) )"

[git_status]
format = "([$untracked$staged$modified$deleted$renamed$conflicted$stashed$ahead_behind ]($style))"
# options available for format
staged = "[+](green)"
modified = "[!](yellow)"
renamed = "[»](blue)"
deleted = "[-](red)"
untracked = "[?](red)"
stashed = "[≡](lavender)"
conflicted = "[✖](red bold)"

ahead = "[⇡${count}](teal)"
behind = "[⇣${count}](peach)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](mauve)"

[custom.git_worktree_unix]
description = "Show indicator when inside a git worktree"
shell = ["bash"]
os = "unix"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
  common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
  git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
  if [ "$common_dir" != "$git_dir" ]; then
    echo "⛓ "
  fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "([$output ]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true

[custom.git_worktree_windows]
description = "Show indicator when inside a git worktree"
shell = ["pwsh", "-NoProfile", "-Command", "-"]
os = "windows"
command = """
$common_dir = git rev-parse --path-format=absolute --git-common-dir 2>$null
if ($LASTEXITCODE -ne 0) {
  exit $LASTEXITCODE
}
$git_dir = git rev-parse --path-format=absolute --git-dir 2>$null
if ($LASTEXITCODE -ne 0) {
  exit $LASTEXITCODE
}
if ($common_dir -ne $git_dir) {
  Write-Output "⛓ "
}
"""
when = """
git rev-parse --is-inside-work-tree 2>$null | Out-Null
exit $LASTEXITCODE
"""
format = "([$output ]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true

[git_metrics]
disabled = false
added_style = "bold fg:green"
deleted_style = "bold fg:red"
only_nonzero_diffs = true
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[nodejs]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[bun]
detect_files = ["bun.lock", "bun.lockb"]

[c]
symbol = " "
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[rust]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"
detect_files = ["go.mod"]

[php]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[java]
symbol = " "
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[kotlin]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[haskell]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[python]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version) ]($style)"

[docker_context]
symbol = ""
format = "[ $symbol( $context) ]($style)"

[container]
disabled = true

