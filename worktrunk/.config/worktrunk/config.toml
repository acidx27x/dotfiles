# Change default branch with:
# wt config state default-branch set <name>
worktree-path = "{{ repo_path }}/../.{{ repo }}-worktrees/{{ branch | sanitize }}"

[pre-start]
copy = "wt step copy-ignored --require-include"

# Include branches that don't have worktrees yet
[list]
branches = true

# Only stage tracked files for Worktrunk commits
[commit]
stage = "tracked"

# Conservative merge behavior
[merge]
commit = false
remove = false

# Preserve branches when removing worktrees
[remove]
delete-branch = false

[switch.picker]
pager = "delta --paging=never --width=$COLUMNS"
preview = true
