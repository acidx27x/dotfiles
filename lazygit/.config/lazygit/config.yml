# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
notARepository: prompt
promptToReturnFromSubprocess: true

os:
  editPreset: nvim

git:
  remoteBranchSortOrder: alphabetical

  log:
    order: topo-order
    showGraph: when-maximised
    showWholeGraph: false

  diffRenderers:
    - name: Delta
      colorArg: never
      command: delta --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

    - name: Side-by-side
      colorArg: never
      command: delta --paging=never --side-by-side --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

    # Cycle renderers with |; Difftastic uses native dark-background colors.
    - name: Difftastic
      type: extDiff
      command: difft --display=inline --color=always --background={{colorScheme}} --width={{width}} --context={{diffContext}}

    - name: Difftastic side-by-side
      type: extDiff
      command: difft --display=side-by-side-show-both --color=always --background={{colorScheme}} --width={{width}} --context={{diffContext}}

gui:
  language: en
  nerdFontsVersion: "3"
  tabWidth: 2
  scrollOffMargin: 5

  filterMode: fuzzy

  sidePanelWidth: 0.3
  mainPanelSplitMode: flexible
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2

  showNumstatInFilesView: true
  fileTreeSortOrder: foldersFirst
  showDivergenceFromBaseBranch: arrowAndNumber

  switchTabsWithPanelJumpKeys: true

  animateExplosion: true
  spinner:
    frames:
      - "◐"
      - "◓"
      - "◑"
      - "◒"
    rate: 120

  border: rounded
  colorScheme: dark
  darkTheme:
    defaultFgColor: ["#DCD7BA"]
    activeBorderColor: ["#98BB6C", bold]
    inactiveBorderColor: ["#6F806E"]
    searchingActiveBorderColor: ["#E6C384", bold]
    optionsTextColor: ["#C0A36E"]

    selectedLineFgColor: [bold]
    selectedLineBgColor: ["#4e657c"]
    inactiveViewSelectedLineBgColor: ["#3D322B"]

    unstagedChangesColor: ["#E46876"]

    cherryPickedCommitFgColor: ["#1F1F28"]
    cherryPickedCommitBgColor: ["#98BB6C"]

    markedBaseCommitFgColor: ["#1F1F28"]
    markedBaseCommitBgColor: ["#E6C384"]

keybinding:
  universal:
    gotoTop: "g"
    gotoBottom: "G"
    undo: "u"

    prevPage: "<ctrl+u>"
    nextPage: "<ctrl+d>"

    scrollUpMain:
      - "<pgup>"
      - "K"

    scrollDownMain:
      - "<pgdown>"
      - "J"

customCommands:
  - key: "<alt+t>"
    context: files
    description: review all uncommitted changes in tuicr
    command: tuicr -w
    output: terminal

  - key: "<alt+t>"
    context: commits
    description: review selected commit in tuicr
    command: tuicr -r {{.SelectedCommit.Hash | quote}}
    output: terminal

  - key: "<alt+t>"
    context: localBranches
    description: review base..selected-branch in tuicr
    prompts:
      - type: input
        title: base ref
        key: Base
        initialValue: HEAD
        suggestions:
          preset: branches
    command: tuicr -r {{printf "%s..%s" .Form.Base .SelectedLocalBranch.Name | quote}}
    output: terminal

  - key: "<ctrl+n>"
    context: localBranches
    description: create prefixed branch
    prompts:
      - type: menu
        title: branch type
        key: Type
        options:
          - value: feat
          - value: fix
          - value: chore
      - type: input
        title: branch name
        key: Name
    command: >-
      git checkout -b
      {{printf "%s/%s" .Form.Type .Form.Name | quote}}

  - key: "<alt+c>"
    context: files
    description: conventional commit
    prompts:
      - type: menu
        title: commit type
        key: Type
        options:
          - value: feat
          - value: fix
          - value: docs
          - value: refactor
          - value: chore
      - type: input
        title: commit subject
        key: Subject
    command: >-
      git commit -m
      {{printf "%s: %s" .Form.Type .Form.Subject | quote}}
