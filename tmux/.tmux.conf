#------------------------------------------
# General Settings
#------------------------------------------

# Terminal compatibility and behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:clipboard"
set -s escape-time 0
set -g focus-events on
set -g allow-passthrough all

# Prefix
set -g prefix C-b
unbind C-s
bind C-b send-prefix

# Display, indexing, and history
set -g status on
set -g status-position top
set -g display-time 4000
set -g window-status-separator ''
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy on
set -g set-clipboard on
set -g history-limit 50000
setw -g monitor-activity on

#------------------------------------------
# Window and Pane Management
#------------------------------------------

# Create windows and split panes in the current directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Window navigation
bind -n M-n next-window
bind -n M-p previous-window
bind Tab last-window

# Move windows in the tab order, keeping the moved window focused
bind -n M-9 swap-window -d -t -1
bind -n M-0 swap-window -d -t +1

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom
bind z resize-pane -Z

# Configuration reload
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Lazygit in the current pane's directory
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit

#------------------------------------------
# Copy Mode Settings
#------------------------------------------

# Copy mode access
bind [ copy-mode
bind Escape copy-mode

# Vim-style selection and copying
set -g mode-keys vi
set -g status-keys emacs
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Write OSC 52 directly to the selecting terminal; keep the normal tmux paste buffer.
# With no selection, the first y selects the line and the second copies it.
bind -T copy-mode-vi y if -F '#{selection_present}' {
  send -X copy-pipe -C \
    'printf "\033]52;c;%s\007" "$(base64 | tr -d "\n")" > "#{client_tty}"'
} {
  send -X select-line
}
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel -C \
  'printf "\033]52;c;%s\007" "$(base64 | tr -d "\n")" > "#{client_tty}"'
bind -T copy-mode-vi Escape send -X cancel
# The vi copy table already binds /, ?, n, and N for search.

#------------------------------------------
# Session Management
#------------------------------------------

# Previous session
bind C-l switch-client -l

# Acknowledge completed shell commands when visiting their window or session.
set-hook -g 'session-window-changed[90]' 'set-option -wu @command_done'
set-hook -g 'client-session-changed[90]' 'set-option -wu @command_done'
set-hook -g 'client-attached[90]' 'set-option -wu @command_done'

# Saved environment snapshots
bind B display-popup -E -w 90% -h 80% 'bash "$HOME/.config/tmux/scripts/snapshots.sh"'

# Workmux dashboard and opt-in sidebar
bind C-s display-popup -w 90% -h 80% -E 'workmux dashboard --tab worktrees'
bind C-t run-shell -b 'workmux sidebar'
bind C-j run-shell -b 'workmux sidebar next'
bind C-k run-shell -b 'workmux sidebar prev'

# Fzf environment and launcher
set -ag update-environment ' FZF_DEFAULT_OPTS_FILE FZF_DEFAULT_OPTS'
set-environment -g TMUX_FZF_ORDER 'window|pane|command|keybinding|clipboard'
set-environment -g TMUX_FZF_LAUNCH_KEY F
set-environment -g TMUX_FZF_OPTIONS '-p -w 90% -h 80% -m'

# SessionX picker
set -g @sessionx-bind 's'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-width '90%'
set -g @sessionx-window-height '60%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-prompt '∼ '
set -g @sessionx-pointer '▶'
set -g @sessionx-git-branch 'on'
set -g @sessionx-preview-location 'top'
set -g @sessionx-preview-ratio '60%'
set -g @sessionx-additional-options '--no-multi'
set -g @sessionx-bind-scroll-up 'ctrl-b'
set -g @sessionx-bind-scroll-down 'ctrl-f'
set -g @sessionx-bind-back 'alt-b'
set -g @sessionx-bind-zo-new-window 'alt-z'

#------------------------------------------
# Plugin Settings
#------------------------------------------

# Ukiyo statusline
set -g @ukiyo-theme 'kanagawa/dragon'
set -g @ukiyo-ignore-window-colors false
# Use Kanagawa Wave's fujiWhite for default pane text.
set -g window-style 'fg=#dcd7ba,bg=default'
set -g window-active-style 'fg=#dcd7ba,bg=default'
set -g @ukiyo-show-powerline true
set -g @ukiyo-plugins 'battery weather'
set -g @ukiyo-show-fahrenheit false
set -g @ukiyo-show-location true
set -g @ukiyo-menu-key 'T'

# Which-key menu
set -g @tmux-which-key-xdg-enable 1

# Smart Splits navigation and resizing
set -g @smart-splits_at_edge 'stop'
set -g @smart-splits_move_left_key M-h
set -g @smart-splits_move_down_key M-j
set -g @smart-splits_move_up_key M-k
set -g @smart-splits_move_right_key M-l
set -g @smart-splits_resize_left_key M-Left
set -g @smart-splits_resize_down_key M-Down
set -g @smart-splits_resize_up_key M-Up
set -g @smart-splits_resize_right_key M-Right
set -g @smart-splits_resize_step_size 2

# Session persistence
set -g @continuum-restore 'on'

# Use Shift+s / Shift+r after the prefix for manual save and restore.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'false'

#------------------------------------------
# Plugin Installation and Initialization
#------------------------------------------

# First-time setup: git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then start tmux and press Ctrl-b, Shift-i to install the plugins below.
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'Nybkox/tmux-ukiyo'

set -g @plugin 'omerxx/tmux-sessionx'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'smart-splits-nvim/backend-tmux'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# GNU realpath is needed by tmux-which-key's XDG configuration on macOS.
run-shell 'if [ "$(uname)" = Darwin ]; then tmux -S "#{socket_path}" set-environment -g PATH "$(brew --prefix coreutils)/libexec/gnubin:$PATH"; fi'
run '~/.tmux/plugins/tpm/tpm'

#------------------------------------------
# Status Bar Configuration
#------------------------------------------

# Layout and refresh interval; applied after Ukiyo loads
set -g status-justify left
set -g status-interval 30

# Hide output activity for windows containing TUIs, including those running inline.
# Check every pane; alternate-screen applications need no explicit command entry.
set -g @activity-tui-commands 'codex|claude|gemini|opencode|aider|workmux|bbrew'
set -ag @activity-tui-commands '|nvim|vim|vi|view|nview|vimdiff|nvimdiff|hx|helix|nano|micro|emacs'
set -ag @activity-tui-commands '|less|more|most|jless|glow|man|info|tig|tuicr|lazygit|gitui'
set -ag @activity-tui-commands '|yazi|broot|ranger|lf|nnn|mc|vifm|ncdu|gdu'
set -ag @activity-tui-commands '|top|htop|btop|btm|bottom|glances|nvtop|iotop|iftop|nethogs'
set -ag @activity-tui-commands '|fzf|fzf-make|sk|atuin|lazydocker|k9s|watch|tmux|zellij'
set -ag @activity-tui-commands '|cmus|ncmpcpp|nmtui|alsamixer|s-tui|nmon|powertop|bmon'
set -g @activity-tui-window '#{m:*1*,#{P:#{||:#{alternate_on},'
set -ag @activity-tui-window '#{m/r:^(#{@activity-tui-commands})$,#{pane_current_command}}}}}'

# Cycle inactive Dragon tabs by window number; highlight the active tab after Ukiyo loads.
set -g @tab-color '#{?window_active,#e6c384,'
set -ag @tab-color '#{?#{==:#{e|%:#{window_index},4},1},#87a987,'
set -ag @tab-color '#{?#{==:#{e|%:#{window_index},4},2},#8ba4b0,'
set -ag @tab-color '#{?#{==:#{e|%:#{window_index},4},3},#8992a7,#b6927b}}}}'
set -g @tab-format '#[fg=#282727,bg=#{E:@tab-color}]'
set -ag @tab-format '#[fg=#1d1c19]#{?window_active,#[bold] ●,} #I #W'
set -ag @tab-format '#{?@workmux_status, #{@workmux_status},}'
set -ag @tab-format '#{?@command_done, #{@command_done},}'
set -ag @tab-format '#{?#{&&:#{window_activity_flag},#{!:#{E:@activity-tui-window}}}, !,} '
set -ag @tab-format '#[fg=#{E:@tab-color},bg=#282727,nobold,nounderscore]'
set -g window-status-format '#[default]#{E:@tab-format}'
set -g window-status-current-format '#[default]#{E:@tab-format}'

# Show a dim separator on the second row; prompts and messages temporarily replace it.
set -g status 2
set -g status-format[1] '#[fg=#393836,bg=default]#{R:─,#{client_width}}'
set -g message-line 1
bind : command-prompt
