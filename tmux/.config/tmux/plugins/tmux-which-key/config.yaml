command_alias_start_index: 200
keybindings:
  prefix_table: Space
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables: []
macros: []
items:
  - name: Panes
    key: p
    menu:
      - name: Split right
        key: v
        command: 'split-window -h -c "#{pane_current_path}"'
      - name: Split below
        key: s
        command: 'split-window -v -c "#{pane_current_path}"'
      - name: Left
        key: h
        command: select-pane -L
      - name: Down
        key: j
        command: select-pane -D
      - name: Up
        key: k
        command: select-pane -U
      - name: Right
        key: l
        command: select-pane -R
      - name: Zoom
        key: z
        command: resize-pane -Z
  - name: Windows
    key: w
    menu:
      - name: New
        key: n
        command: 'new-window -c "#{pane_current_path}"'
      - name: Previous
        key: h
        command: previous-window
      - name: Next
        key: l
        command: next-window
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Find (tmux-fzf)
        key: f
        command: 'run-shell -b "TMUX_FZF_CLIENT=#{client_tty} $HOME/.tmux/plugins/tmux-fzf/scripts/window.sh switch"'
  - name: Sessions (sesh)
    key: s
    command: 'display-popup -E -h 60% -w 90% "sesh picker -i"'
  - name: Sessions (SessionX)
    key: o
    command: 'run-shell "$HOME/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh"'
  - name: Previous session (sesh)
    key: L
    command: 'run-shell "sesh last"'
  - name: Find (tmux-fzf)
    key: f
    command: 'run-shell -b "TMUX_FZF_CLIENT=#{client_tty} $HOME/.tmux/plugins/tmux-fzf/main.sh"'
  - name: Backup
    key: b
    menu:
      - name: Save
        key: s
        command: 'run-shell -b "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"'
      - name: Restore
        key: r
        command: 'run-shell -b "$HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh"'
  - name: Smart Splits
    key: m
    menu:
      - name: Move left
        key: h
        command: send-keys -K M-h
      - name: Move down
        key: j
        command: send-keys -K M-j
      - name: Move up
        key: k
        command: send-keys -K M-k
      - name: Move right
        key: l
        command: send-keys -K M-l
      - name: Resize left
        key: H
        command: send-keys -K M-Left
      - name: Resize down
        key: J
        command: send-keys -K M-Down
      - name: Resize up
        key: K
        command: send-keys -K M-Up
      - name: Resize right
        key: L
        command: send-keys -K M-Right
  - name: Plugins (TPM)
    key: P
    menu:
      - name: Install
        key: i
        command: 'run-shell "$HOME/.tmux/plugins/tpm/bindings/install_plugins"'
      - name: Update
        key: u
        command: 'run-shell "$HOME/.tmux/plugins/tpm/bindings/update_plugins"'
      - name: Remove unused
        key: c
        command: 'run-shell "$HOME/.tmux/plugins/tpm/bindings/clean_plugins"'
  - name: Reload config
    key: r
    command: "source-file ~/.tmux.conf"
  - name: Statusline settings
    key: T
    command: 'run-shell "$HOME/.tmux/plugins/tmux-ukiyo/menu_items/main.sh"'
