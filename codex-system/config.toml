# Managed by acidx27x/dotfiles setup/codex.sh

###############################################################################
# Default model and response behavior
###############################################################################
# Recommended default model example in current Codex sample config.
model = "gpt-6.1-sol"

# Supported Sol levels: "low", "medium", "high", "xhigh", "max", "ultra".
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"

# Options: "low", "medium", "high".
model_verbosity = "medium"

# Options: "auto", "concise", "detailed", "none".
model_reasoning_summary = "auto"

# Options include "fast" and "flex".
service_tier = "default"

# Let Codex/model defaults handle auto-compaction unless you have a specific need.
# model_auto_compact_token_limit = 128000

# Big enough for build/test logs without flooding context too much.
tool_output_token_limit = 12000

# Maximum wait per background-terminal poll, in milliseconds; not a command timeout.
background_terminal_max_timeout = 900000

# Leave provider stream retry/idle settings unset unless configured under a custom provider.
# stream_max_retries = 15
# stream_idle_timeout_ms = 5400000

# Use "live" only when you need newest docs/news.
# Options: "cached", "live", "disabled".
web_search = "live"

###############################################################################
# Approval and permission policy
###############################################################################
# Options: "on-request", "never".
approval_policy = "on-request"
approvals_reviewer = "user"

# IMPORTANT:
# Do not set sandbox_mode when using permission profiles.
# Permission profiles do not compose with sandbox_mode / sandbox_workspace_write.
#
# sandbox_mode = "workspace-write"

# Use the custom permission profile defined below.
# Built-ins include ":read-only", ":workspace", ":danger-full-access".
default_permissions = "locked_folders_only"

# Prevent shell tools from using login-shell behavior.
allow_login_shell = false

###############################################################################
# Windows sandbox
###############################################################################
[windows]
# Recommended when running Codex natively on Windows.
# Use "unelevated" only if elevated setup fails or you lack admin permissions.
sandbox = "elevated"

###############################################################################
# Strong filesystem permissions profile
#
# Rules:
# - ":minimal" allows minimal OS/runtime access needed for commands to run.
# - Codex's runtime workspace roots are writable.
# - Sensitive globs inside allowed folders are denied.
###############################################################################
[permissions.locked_folders_only.filesystem]
# Minimal OS/runtime access needed to execute normal commands.
":minimal" = "read"

# Allow tools to create temporary files outside the workspace.
":tmpdir" = "write"
":slash_tmp" = "write"

# Codex must be able to execute its own Homebrew-installed runtime
# from inside the bwrap sandbox.
"/home/linuxbrew/.linuxbrew/Caskroom/codex" = "read"
"/home/linuxbrew/.linuxbrew" = "read"
"/opt/homebrew/Caskroom/codex" = "read"
"/opt/homebrew" = "read"

# Also may be needed.
"~/.codex/packages/app-server-daemon" = "read"
"~/.codex" = "read"

# SSH settings and trusted host keys; private keys stay outside this grant.
"~/.ssh/config" = "read"
"~/.ssh/config.d" = "read"
"~/.ssh/known_hosts" = "read"

# User specific common paths.
"~/.local" = "read"
"/opt/rust" = "read"

# Windows specific paths.
"~/scoop/apps/codex" = "read"
"~/scoop/apps" = "read"
"~/scoop/shims" = "read"

# Required/recommended when using unbounded ** deny globs on platforms that
# pre-expand glob matches before sandbox startup.
glob_scan_max_depth = 3

[permissions.locked_folders_only.filesystem.":workspace_roots"]
# Allow read/write access inside each workspace root supplied by the current
# Codex session. A user config may add extra workspace_roots when needed.
"." = "write"

# Keep repository and Codex metadata readable but not writable.
".git" = "read"
".codex" = "read"

# Deny specific sensitive filenames while keeping examples and source files readable.
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.development" = "deny"
"**/.env.test" = "deny"
"**/.env.staging" = "deny"
"**/.env.production" = "deny"
"**/.env.*.local" = "deny"
"**/.secrets" = "deny"
"**/.tokens" = "deny"
"**/.credentials" = "deny"
"**/secrets.json" = "deny"
"**/tokens.json" = "deny"
"**/credentials.json" = "deny"
"**/id_rsa" = "deny"
"**/id_ed25519" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/.aws/**" = "deny"
"**/.ssh/**" = "deny"

###############################################################################
# Network policy for the locked profile
###############################################################################
[permissions.locked_folders_only.network]
enabled = true

# Proxy mode; domain rules below still apply when the network proxy is active.
# Options: "limited", "full".
mode = "full"

# Expose SOCKS5 for SSH ProxyCommand clients; SSH does not use HTTP_PROXY.
enable_socks5 = true
socks_url = "http://127.0.0.1:8081"

# Specific sites only settings.
[permissions.locked_folders_only.network.domains]
# Official OpenAI documentation and Codex connectivity diagnostics.
"developers.openai.com" = "allow"
"platform.openai.com" = "allow"
"learn.chatgpt.com" = "allow"
"chatgpt.com" = "allow"

# GitHub repositories, API, source files, archives, and releases.
"github.com" = "allow"
# Alternate SSH endpoint on port 443.
"ssh.github.com" = "allow"
"api.github.com" = "allow"
"raw.githubusercontent.com" = "allow"
"codeload.github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"release-assets.githubusercontent.com" = "allow"
"ghcr.io" = "allow"
"pkg-containers.githubusercontent.com" = "allow"

# GitLab repositories and container registry.
"gitlab.com" = "allow"
"altssh.gitlab.com" = "allow"
"registry.gitlab.com" = "allow"

# Package managers.
"registry.npmjs.org" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"crates.io" = "allow"
"static.crates.io" = "allow"
"index.crates.io" = "allow"
"proxy.golang.org" = "allow"
"sum.golang.org" = "allow"
"formulae.brew.sh" = "allow"
"get.scoop.sh" = "allow"

# Other Git hosts.
"codeberg.org" = "allow"
"git.sr.ht" = "allow"
"bitbucket.org" = "allow"
"altssh.bitbucket.org" = "allow"
"api.bitbucket.org" = "allow"

# Upstream source archives.
"git.kernel.org" = "allow"
"cdn.kernel.org" = "allow"
"ftp.gnu.org" = "allow"

###############################################################################
# Shell environment hardening
###############################################################################
[shell_environment_policy]
# Options: "all", "core", "none".
# Inherit all variables except those matched by the explicit filters below.
inherit = "all"

# Use only the explicit exclusions below instead of built-in secret-name exclusions.
ignore_default_excludes = true

[shell_environment_policy.filters]
# Case-insensitive exclusions; variables with other names pass through.
"*KEY*" = "exclude"
"*SECRET*" = "exclude"
"*TOKEN*" = "exclude"
"*PASSWORD*" = "exclude"
"*CREDENTIAL*" = "exclude"
"AWS_*" = "exclude"

[shell_environment_policy.set]
CODEX_LOCKED_FOLDERS_ONLY_PERMISSIONS = "1"
# Route Git's SSH transport through the domain-filtered SOCKS5 listener.
# Requires connect on PATH (bundled with Git for Windows; connect-proxy on Linux).
GIT_SSH_COMMAND = 'ssh -o "ProxyCommand=connect -5 -S 127.0.0.1:8081 %h %p"'

###############################################################################
# Official documentation MCP server
###############################################################################
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

###############################################################################
# Feature flags
###############################################################################
[features]
# The newer windows MXC sandbox avoids the legacy administrator-approved setup.
prefer_mxc = true

# Speed up repeated commands by snapshotting shell environment.
shell_snapshot = true

# Enable the standard shell tool.
shell_tool = true

# Enforce permission-profile network domain rules for sandboxed commands.
network_proxy = true

# More predictable and simpler behavior.
multi_agent = false

# Keep memories disabled for privacy.
memories = false

# Hooks are useful, but only keep enabled if you trust your hook config.
hooks = false

###############################################################################
# Privacy, analytics, and telemetry
###############################################################################
[analytics]
enabled = false

[otel]
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"
log_user_prompt = false

###############################################################################
# TUI
###############################################################################
[tui]
vim_mode_default = true
resume_cwd = "session"
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
notification_method = "auto"
pet = "disabled"
theme = "gruvbox-dark"
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "run-state",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "used-tokens",
  "thread-title",
  "task-progress",
  "fast-mode",
]
status_line_use_colors = true
terminal_title = [
  "activity",
  "project-name",
  "run-state",
  "thread-title",
  "task-progress",
]

# Not working under wezterm under WSL.
# [tui.keymap.composer]
# submit = ["ctrl-enter", "cmd-enter"]
# queue = []

[tui.presets.1]
label = "Review changes"
input = "/review"
